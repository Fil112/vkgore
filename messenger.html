<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мессенджер | ВКонтакте</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232688eb'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-weight='bold' font-size='28' text-anchor='middle' fill='white'%3EВК%3C/text%3E%3C/svg%3E" />
  <script>
    try {
      if (localStorage.getItem("vk_theme_v1") === "dark") {
        document.documentElement.classList.add("dark-theme");
      }
      if (!localStorage.getItem("vk_auth_role_v1")) {
        window.location.replace("login.html");
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="vk-header">
    <div class="vk-header-inner">
      <div class="vk-header-left">
        <a href="index.html" class="vk-logo">
          <span class="vk-logo-badge">ВК</span>
          <span class="vk-logo-text">ВКонтакте</span>
        </a>
      </div>
      <div class="vk-header-right">
        <button class="theme-toggle-btn" id="themeToggleBtn" title="Переключить тему">🌙</button>
        <span class="vk-user-mini" id="headerUserName">Гость</span>
        <div class="vk-avatar-mini" id="headerMiniAvatar">Г</div>
        <a href="login.html" class="btn btn-secondary btn-sm" id="switchAuthBtn">Сменить</a>
      </div>
    </div>
  </header>

  <div class="vk-layout">
    <aside class="vk-sidebar">
      <nav class="vk-nav">
        <a href="index.html" class="vk-nav-item">🏠 Моя страница</a>
        <a href="index.html#wall" class="vk-nav-item">📰 Новости <span class="badge">1813</span></a>
        <a href="messenger.html" class="vk-nav-item active">💬 Мессенджер <span class="badge">7</span></a>
        <a href="index.html#friends-tab" class="vk-nav-item">👥 Друзья <span class="badge">6</span></a>
      </nav>
    </aside>

    <main class="vk-main view-animate">
      <section class="card messenger-page-card">
        <div class="modal-header">
          <div class="messenger-header-left">
            <strong>💬 Мессенджер</strong>
            <span class="gemini-badge" id="geminiStatusBadge">Локальный бот</span>
          </div>
          <div class="messenger-header-actions">
            <button class="btn btn-secondary btn-sm" id="clearChatBtn" title="Очистить текущий диалог">Очистить</button>
            <button class="btn btn-secondary btn-sm" id="geminiSettingsBtn" title="Подключить Gemini AI">⚙️ ИИ</button>
          </div>
        </div>

        <div class="gemini-panel hidden" id="geminiSettingsPanel">
          <div class="gemini-panel-title">Подключение Gemini (gemini-3.8-flash)</div>
          <p class="hint">Ключ сохраняется только в вашем браузере (в <code>localStorage</code>) и работает во всех диалогах.</p>
          <div class="gemini-input-row">
            <input type="password" id="geminiKeyInput" placeholder="Вставьте Gemini API Key (AIza...)" />
            <button class="btn btn-primary btn-sm" id="saveGeminiKeyBtn">Сохранить</button>
            <button class="btn btn-secondary btn-sm" id="clearGeminiKeyBtn">Сбросить</button>
          </div>
        </div>

        <div class="messenger-body">
          <div class="dialog-list" id="dialogList">
            <button class="dialog-item" data-peer="skalozub">
              <div class="dialog-av av-skalozub">СС</div>
              <div class="dialog-meta">
                <div class="dialog-name">Сергей Скалозуб</div>
                <div class="dialog-preview" id="skalozubDialogPreview">Раз, два! Вот и вся наука.</div>
              </div>
            </button>
            <button class="dialog-item" data-peer="famusov">
              <div class="dialog-av av-famusov">ПФ</div>
              <div class="dialog-meta">
                <div class="dialog-name">Павел Фамусов</div>
                <div class="dialog-preview">Заезжайте в четверг на обед!</div>
              </div>
            </button>
            <button class="dialog-item" data-peer="sofia">
              <div class="dialog-av av-sofia">СФ</div>
              <div class="dialog-meta">
                <div class="dialog-name">Софья Фамусова</div>
                <div class="dialog-preview">Только не про учения...</div>
              </div>
            </button>
            <button class="dialog-item" data-peer="liza">
              <div class="dialog-av av-liza">Л</div>
              <div class="dialog-meta">
                <div class="dialog-name">Лизанька</div>
                <div class="dialog-preview">Тсс! Барин услышит...</div>
              </div>
            </button>
            <button class="dialog-item" data-peer="repetilov">
              <div class="dialog-av av-repetilov">Р</div>
              <div class="dialog-meta">
                <div class="dialog-name">Репетилов</div>
                <div class="dialog-preview">Шумим, братец, поехали!</div>
              </div>
            </button>
            <button class="dialog-item" data-peer="khlestova">
              <div class="dialog-av av-khlestova">АХ</div>
              <div class="dialog-meta">
                <div class="dialog-name">Анфиса Хлёстова</div>
                <div class="dialog-preview">Трёх сажень удалец...</div>
              </div>
            </button>
            <button class="dialog-item" data-peer="chatsky">
              <div class="dialog-av av-chatsky">АЧ</div>
              <div class="dialog-meta">
                <div class="dialog-name">Александр Чацкий</div>
                <div class="dialog-preview" id="chatskyDialogPreview">Карету мне, карету!</div>
              </div>
            </button>
          </div>

          <div class="chat-pane">
            <div class="chat-peer-bar">
              <div>
                <strong id="chatPeerName">Сергей Скалозуб</strong>
                <div class="hint" id="chatPeerSub">Полковник 45-го егерского полка</div>
              </div>
              <a href="index.html" class="link-btn" id="openPeerProfileLink">Профиль ▸</a>
            </div>

            <div class="chat-messages" id="chatMessages"></div>

            <div class="chat-blocked-notice hidden" id="chatBlockedNotice"></div>

            <div class="chat-input-row" id="chatInputRow">
              <input type="text" id="chatInput" placeholder="Напишите сообщение..." />
              <button class="btn btn-primary btn-sm" id="sendChatBtn">Отправить</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="messenger.js"></script>
</body>
</html>
